.pt-areas{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.pt-area{background:var(--inset);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600}
.pt-area[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pt-topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-block-start:14px}
.pt-topic{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.pt-topic:hover,.pt-topic[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pt-topic b{display:block;font-size:15px;margin-block-end:4px}
.pt-topic span{display:block;font-size:13.5px;color:var(--muted);line-height:1.5}
.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:12px;padding:7px 14px;font-size:13px;font-weight:700;flex:none;white-space:nowrap}
.ghost:hover{background:var(--inset)}
.pt-step{border:1px solid var(--line);border-inline-start:5px solid var(--kc);border-radius:12px;padding:14px 16px;margin-block-start:14px;background:var(--surface)}
.pt-step:first-child{margin-block-start:0}
.pt-step label{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pt-k{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--kc)}
.pt-q{font-weight:700;font-size:15px}
.pt-d{margin:4px 0 8px;font-size:13.5px;color:var(--muted)}
.pt-step textarea{display:block;inline-size:100%;box-sizing:border-box;min-block-size:64px;resize:vertical;font:inherit;font-size:15px;line-height:1.6;color:var(--ink);background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pt-step textarea:focus-visible{outline:3px solid var(--kc);outline-offset:1px}
.pt-chips{display:flex;flex-wrap:wrap;gap:6px;margin-block-start:8px}
.pt-chip{background:transparent;border:1px dashed var(--kc);color:var(--kc);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600}
.pt-chip:hover{background:var(--inset)}
.pt-meter{display:flex;align-items:center;gap:10px;margin-block-start:18px;font-size:13px;font-weight:700;color:var(--muted)}
.pt-dots{display:flex;gap:5px}
.pt-dot{inline-size:12px;block-size:12px;border-radius:50%;background:var(--track)}
.pt-dot.on{background:var(--kc)}
.pt-tip{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.pt-prev{margin-block-start:16px;border:2px solid var(--accent);border-radius:14px;padding:16px 18px;background:var(--surface)}
.pt-prevh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-block-end:6px}
.pt-prevh .moreh{margin:0}
.pt-prevt{margin:0;white-space:pre-wrap;font-size:16px;line-height:1.8}
.pt-prevt.empty{color:var(--muted);font-style:italic}
.pt-btns{display:flex;gap:10px;flex-wrap:wrap;margin-block-start:12px}
.pt-run{margin-block-start:16px;background:var(--inset);border-radius:12px;padding:14px 18px}
.pt-run ol{margin:6px 0 0;padding-inline-start:20px;font-size:14.5px;line-height:1.7}
a.pt-open{display:inline-block;margin-block-start:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;text-decoration:none;padding:9px 16px;border-radius:10px}
a.pt-open:hover{filter:brightness(.92)}
.pt-priv{font-size:12.5px;color:var(--muted);margin:12px 0 0}
@media print{.pt-chips,.pt-btns,.pt-areas,.ghost,a.pt-open{display:none!important}.pt-step textarea{border:1px solid #888;background:none}}
@media print{.side,.barright,.pager,.copy,.toast,.hint{display:none!important}.app{display:block;height:auto}.scroll{overflow:visible}section.ex{display:block;break-before:page}section.ex:first-of-type{break-before:auto}.card,.prompt,.panel,.skill,.story{box-shadow:none;break-inside:avoid}.main{padding:16px 0;max-inline-size:none}.bw a.open{border:1px solid #000;color:#000;background:none}.lnkc::after{content:attr(href);display:block;font-size:11px;color:var(--muted)}}
</style>

an, the three issues that matter most and the decisions needed, in a table with an owner for each."}],"text":"Create a one-page summary of last month's business review for the leadership team, who missed the meeting and decide next month's priorities, using the review email thread, the meeting recap and /[sales workbook]. Show where the numbers landed against plan, the three issues that matter most and the decisions needed, in a table with an owner for each.","how":"An illustrative example: each color matches one of the four ingredients above. To use it for real, point Copilot to your own files and notes."},"flow":[{"t":"The director catches up","d":"Live on 23 November · Activity 1: Find out where the review landed and what is still open.","out":"An email and a meeting invite","target":"workiq"},{"t":"Finance checks the numbers, the analyst builds the review","d":"Live on 23 November · Activity 2: Compare the year, explain the variance, build the dashboard and the review deck.","out":"A forecast page, a dashboard and a review deck","target":"data"},{"t":"The project manager turns the meeting into momentum, and every market hears about it","d":"Live on 23 November · Activity 3: A custom meeting summary, a status update and one message for every market.","out":"A meeting summary, a status update and a multi-market update","target":"week"},{"t":"The analyst asks Researcher","d":"Live on 23 November · Activity 4: Research the market with Researcher.","out":"A sourced research briefing","target":"agents"}]},{"id":"workiq","kind":"try","nav":"Copilot knows your work","navSub":"Progressive prompting","title":"Copilot knows your work","desc":"One conversation, four steps: find what needs you, narrow it to the decisions, check it against a document, then draft the email. Each step builds on the answer before it.","skill":"Progressive prompting","features":"Copilot Chat grounded in your email, meetings, chats and files","notes":["Run all four prompts in the same conversation, so each one builds on the last."],"story":{"label":"Live on 23 November · Chapter 1 of 4","title":"The director catches up","setup":"A director was traveling during last month's business review. The numbers, the decisions and the follow-ups are spread across email, the meeting and shared files, and the next review is close.","output":"An email to the team with the open items, and a follow-up meeting on the calendar.","takeaway":"Work IQ means you start from your work, not a blank page. Stay in the same conversation so each answer builds on the last.","session":"Live on 23 November"},"prompts":[{"app":"Copilot Chat","appIcon":"chat","title":"Catch me up on last week's review","text":"Catch me up on last week's business review. From the email thread, the meeting recap and the files that were shared, where did the numbers land against plan and what is still open?","how":"Copilot answers from your email, meetings, chats and files, and lists its sources under the answer. Select a source to see exactly where a point came from: Word, Excel and PowerPoint files open right inside Copilot, so you can check the original without leaving the chat.","stage":"simple","more":["What did I commit to this week that is not done yet?"],"storyLine":"The director starts with one plain question.","id":"1.1","status":"licensed"},{"app":"Copilot Chat","appIcon":"chat","title":"Add a file and ask for a format","text":"Compare those open items with /[sales workbook or review deck]. Which three need a decision from me before the next review? Show a table with the decision, who is involved, the deadline, what the file says and what is at stake in one line.","how":"Delete the bracket, type / and pick the file. Copilot uses it alongside your email and meetings, so one prompt combines a file and the format you want back.","stage":"build","storyLine":"Narrow it to what needs the director, against the numbers in the file.","id":"1.2","status":"licensed"},{"app":"Copilot Chat","appIcon":"chat","title":"Draft the email to the team","text":"Draft an email to [my team] with the priorities at risk and the three questions, asking for their answers before [our next team meeting]. Keep it under 150 words.","how":"Before you send the prompt, open the model picker: Auto chooses a model for the task, or you can pick one yourself. Copilot brings leading models, including OpenAI and Anthropic models, into one experience, depending on Swire Coca-Cola HK's settings. Copilot drafts the email in the chat, and nothing is sent until you choose to send it.","stage":"build","storyLine":"Get answers before the next review.","id":"1.3","status":"licensed"},{"app":"Copilot Chat","appIcon":"chat","stage":"output","title":"Book the follow-up meeting","text":"Now schedule a 30-minute meeting with [my team] early next week to go through their answers. Find a time that works for everyone and draft the invite with a three-point agenda.","how":"Stay in the same conversation, so Copilot already knows who the email went to and why. Review the time and the agenda before you send the invite. Nothing is sent until you choose to send it.","storyLine":"Put the follow-up on the calendar.","id":"1.4","status":"licensed"}]},{"id":"data","kind":"try","nav":"From data to decision","navSub":"Copilot in Excel, Word and PowerPoint","title":"From data to decision","desc":"Follow one question from a raw workbook to a finished briefing and presentation, and see how the output of one app becomes the input to the next.","skill":"Analyzing, writing and presenting","features":"Copilot Chat with a file, Copilot in Excel, Copilot in Word and Copilot in PowerPoint","notes":["Use the sample workbook below, or a workbook you already work with. Save it to OneDrive or SharePoint first so Copilot in the app can work with it."],"appsEyebrow":"Same Copilot, different app","appsTitle":"Where to run each prompt","appsIntro":"Each app works with the file you have open. Copilot Chat can answer a quick question about a file w ntent, or name the report in your prompt, then ask the same question. You only see reports you already have access to."},"storyLine":"Finance starts with a question in Copilot Chat, before opening Excel.","id":"2.1"},{"app":"Copilot in Excel","appIcon":"excel","title":"Explain the variance to plan","text":"@variance-analysis Compare net sales with plan by region and month for this year. Explain the largest variances, favorable and unfavorable, by price, volume and mix, check the out-of-stock days for the same rows, and add a bridge chart of the biggest gaps.","how":"Skills are reusable instructions that carry a method, such as a variance analysis. Open the workbook in Excel, select Copilot, type @ and pick variance-analysis. To see what is available, open Manage plugins & skills: skills are grouped in folders such as Accounting, and you can turn them on or add your own. Accounting skills are rolling out through the Frontier program, so availability depends on Swire Coca-Cola HK's settings. Without the skill, the same prompt still works as a plain request.","stage":"build","more":["Add a chart or PivotTable on a new sheet that shows the largest variances."],"storyLine":"Which markets are behind plan, which are ahead, and why?","optional":false,"link":{"url":"https://support.microsoft.com/en-us/excel/copilot/copilot-in-excel-built-in-skills","label":"Use built-in skills with Copilot in Excel"},"id":"2.2"},{"app":"Copilot in Excel","appIcon":"excel","title":"Build the review dashboard","text":"Build an interactive executive review dashboard from the Sales sheet: net sales, gross margin and variance to plan for this year against last year, by region and by channel, with a monthly trend and the three insights leadership should see first.","how":"Stay in the same workbook with editing turned on. If interactive-canvas appears under Manage plugins & skills, start the prompt with @interactive-canvas: the dashboard then stays connected to the workbook and updates when the data changes. The skill is still rolling out, so you may not see it yet; the prompt works without it.","stage":"build","optional":false,"storyLine":"The analyst turns the same workbook into something leadership can explore.","groupTitle":"","link":{"url":"https://support.microsoft.com/en-us/excel/copilot/copilot-in-excel-built-in-skills","label":"Use built-in skills with Copilot in Excel"},"more":["Tailor this dashboard for the Taiwan market team: lead with their variance to plan and out-of-stock days.","@chart-design Improve the charts on this sheet: add clear titles, axis labels and data labels, and suggest a better chart type where one fits. (chart-design is off by default; turn it on in Manage plugins & skills.)"],"id":"2.3"},{"app":"Copilot in PowerPoint","appIcon":"ppt","title":"From the workbook to the leadership review","text":"Using /[sales workbook], create a leadership review presentation of six slides with charts and tables: where we landed against plan, what drove it, the markets ahead of and behind plan, the out-of-stock months, the open issues and the decisions required. Apply our brand kit and add speaker notes with the key message for each slide.","how":"Open PowerPoint and select Copilot. Choose a model in the model picker, such as Claude Opus 5.5, where Swire Coca-Cola HK's settings allow it. A brand kit, set up by your brand manager in the Copilot app, keeps the colors, fonts and logo on brand. This prompt takes the longest, so start it early. Check every chart against the workbook before you present.","stage":"output","more":["@create-interactive-slide Turn the variance slide into an interactive slide where leadership can switch between markets."],"storyLine":"The analyst turns it into the leadership review deck.","id":"2.4"},{"app":"Copilot in Excel","appIcon":"excel","title":"Model the promotion","text":"In this workbook, the Sports drinks promotion in July ran at a 25 percent discount. Model the same promotion at an 18 percent discount instead: estimate the effect on units, net sales and gross margin against the actual July results, state the assumptions you used, and put the scenario on a new sheet. Then write a five-line summary for leadership.","how":"Turn editing on so Copilot can add the scenario sheet. The workbook does not record the discount, so Copilot has to assume how units respond to price: read its assumptions first and change them if they do not match your experience.","stage":"build","more":["Rank categories by share of net sales and compare their gross margin. Which are high revenue but lower margin, and what two pricing or mix changes would improve total profit?"],"storyLine":"If time allows: could a shallower discount have kept the volume and saved the margin?","optional":true,"groupTitle":"More to try in Excel and Word","id":"2.5"},{"app":"Copilot in Excel","appIcon":"excel","stage":"build","status":"frontier","title":"Do the two systems agree?","text":"@reconciliation Compare the System A and System B sheets in this workbook. Match the orders by order ID, list every difference (missing orders, duplicates, different amounts or statuses) in a table on a new sheet, and propose a correction for each one for me to review.","how":"Open the orders sample: both systems are already in one workbook. Type @ and pick reconciliation from the Accounting skills. Accounting skills are rolling out through the Frontier program, so availability depends on Swire Coca-Cola HK's settings. Copilot proposes corrections; you decide what to apply.","link":{"url":"https://support.microsoft.com/en-us/excel/copilot/copilot-in-excel-built-in-skills","label":"Use built-in skills with Copilot in Excel"},"more":["Summarize the differences in three lines for the finance team, with the total value at stake."],"optional":true,"id":"2.6"},{"app":"Copilot in Word","appIcon":"word","title":"Fill in the review template","text":"Fill in /[review summary template] using /[meeting recap] and the email thread about [the business review]. Complete every section, keep the template's headings and formatting, and mark anything you could not find as [to confirm].","how":"Open the template in Word and select Copilot. Type / to refer to the meeting and the files. Review every section before you share it.","stage":"build","more":["Which questions remain unanswered before the decision, and who should own each one?","Tighten the executive summary to five lines and lead with the decision required."],"storyLine":"If time allows: the review summary template, filled in from the meeting and the email thread.","optional":true,"id":"2.7"},{"app":"Copilot in Excel","appIcon":"excel","title":"Find what stands out","text":"Which [regions, categories or channels] are trending up or down, and what is unusual?","how":"Open the workbook in Excel and select Copilot. Ask for a chart or PivotTable to make the pattern visible.","stage":"build","more":["Look at the monthly results, identify the months with major changes, and explain the likely drivers using only this data. Give me three insights and three actions.","Highlight the rows where net sales dropped more than 15% compared with the same month last year."],"optional":true,"storyLine":"If time allows: what else stands out in the data?","id":"2.8"},{"app":"Copilot in Excel","appIcon":"excel","title":"Formulas without memorizing syntax","text":"Add a column that [describe the calculation in plain language, such as looks up each region's manager from the Regions sheet].","how":"Describe what you want, not the formula. Copilot writes it and explains it.","stage":"build","optional":true,"more":["Explain how this workbook works: what each sheet does and how the key formulas connect.","Check the formula in [column] for errors or edge cases."],"id":"2.9"},{"app":"Copilot in Excel","appIcon":"excel","title":"Clean up a system export","text":"Standardize the names in [column], split [column] into separate columns, and flag any duplicate rows.","how":"Works on a report pulled from any business system. The sample workbook is already clean, so try this on one of your own exports. Format the data as a table first if Copilot asks.","stage":"build","optional":true,"more":["Explain each step you took so I can repeat this cleanup next month."],"id":"2.10"},{"app":"Copilot in Word","appIcon":"word","title":"Ask questions of a long document","text":"In this [policy, contract or report], list the key dates, obligations and anything unusual, with section references.","how":"Interrogate the document rather than only summarizing it, and check the sections it cites. For a long document you need to absorb on the go, Word can also create an audio overview where it is available.","stage":"build","optional":true,"more":["Write a checklist of follow-up questions for the document owner."],"id":"2.11"},{"app":"Copilot in Word","appIcon":"word","title":"Turn a process into a checklist","text":"Turn this process document into a step-by-step checklist with owners and timing.","how":"Converts narrative content into something a team can act on. Track the checklist in Planner or a Loop component.","stage":"output","optional":true,"id":"2.12"}]},{"id":"week","kind":"try","nav":"Run the week, not the inbox","navSub":"Copilot Chat, Teams and Outlook","title":"Run the week, not the inbox","desc":"Go beyond asking Copilot to summarize: ask it to prioritize, connect several sources and produce the next step. Prepare for a meeting, run it, and send a follow-up people act on.","skill":"Meetings, follow-up and project status","features":"Copilot Chat across email, chats and meetings; Copilot in Teams meetings; Copilot in Outlook","appsEyebrow":"Same Copilot, different app","appsTitle":"Where to run each prompt","appsIntro":"It is one Copilot, but it works with whatever is in front of you. Each prompt names the place to run it.","apps":[{"t":"Copilot Chat","q":"Your email, meetings, chats and files together","d":"Use it when the question spans several sources, such as what needs you this week.","icon":"chat"},{"t":"Copilot in Teams","q":"The meeting you are in, its transcript and recap, or the chat you have open","d":"Use it during or right after a meeting, or to catch up on a busy chat.","icon":"teams"},{"t":"Copilot in Outlook","q":"The email thread you have open","d":"Use it when you are reading, replying to or drafting a specific message.","icon":"outlook"}],"story":{"label":"Live on 23 November · Chapter 3 of 4","title":"The project manager turns the meeting into momentum, and every market hears about it","setup":"The review meeting ended with decisions, but nobody owns the actions yet. The project manager needs a summary in the team's own format, then a status update, and communications has to tell colleagues in three markets what changes for them.","output":"A meeting summary in the team's own format, a status update with checked sources, and one update in English, Traditional Chinese and Simplified Chinese.","takeaway":"Give Copilot your format once, and every meeting summary comes back the way your team reads it.","session":"Live on 23 November"},"prompts":[{"app":"Copilot in Teams","appIcon":"teams","title":"The custom meeting summary","text":"Summarize this meeting using the template below. Write it so it can be shared directly with colleagues across our markets, and name the market or team when you refer to a point. Include an attendee list with titles after the Summary section.\n\n📝 Summary\n🔑 Key Perspectives\n📂 Key Topics Discussed\n⚠️ Challenges and Concerns\n🛠️ Proposed Solutions\n✅ Key Decisions and Tasks\n❓ Q&A","how":"Open the meeting recap in Teams and select Copilot, or open Copilot in the meeting chat once the meeting ends. The meeting needs transcription or recording turned on. Keep the template and reuse it for every review, so each summary comes back in the same shape.","stage":"simple","more":["Write a follow-up email to the attendees of /[meeting] with a table of decisions made, a table of actions with owners and due dates, and a short list of things to consider before the next meeting.","Compare what we committed to today with what we committed to last month. What slipped?","Create a timeline for these actions using business days only, starting on the first of next month."],"storyLine":"The review meeting, summarized the way the team wants to read it.","id":"3.1","status":"licensed"},{"app":"Copilot in Word","appIcon":"word","title":"The status update","text":"Using /[meeting recap] and my email and chats from the last two weeks on [project], write a one-page status update: a two-line summary, a table by workstream with status, key decisions, risks and open items, and the next milestones.","how":"Open a new Word document and select Copilot. Type / to refer to the meeting recap. Check the sources before you share the update.","stage":"build","more":["Give each workstream a red, amber or green rating with a one-line reason, and list any blockers.","What have we decided about [topic] across meetings and email in the last 60 days? Who decided, when, and where is it documented?"],"action":{"title":"Make it repeatable","text":"Select Edit in Pages under the answer to save it as a shared Copilot Page for the team. To run the status prompt every week, hover over your prompt and select Schedule this prompt.","note":"You must run a prompt once before you can schedule it. If scheduling is unavailable, save the prompt and run it each week."},"storyLine":"Turn the decisions and tasks into a status update.","id":"3.2","status":"licensed"},{"app":"Copilot Chat","appIcon":"chat","stage":"build","title":"Check the sources before you share","text":"Before I share this status update: list every email, chat, meeting and file you used for it, with links, and note any sensitivity labels shown on them. Flag anything my wider audience may not be able to open.","how":"Copilot only uses content you already have permission to see, and it keeps your organization's sensitivity labels and policies. Your readers may not have the same access, so check the sources before the update travels further.","storyLine":"Check what the update draws on before it travels.","id":"3.3","status":"licensed"},{"app":"Copilot in Word","appIcon":"word","stage":"output","title":"One update, every market","text":"Using /[status update], write a 200-word internal update for colleagues in Hong Kong, Taiwan and mainland China: what we decided, what changes for them and who to contact. Keep it plain and friendly. Then add a Traditional Chinese version for Hong Kong and Taiwan and a Simplified Chinese version for mainland China.","how":"Open a new Word document and select Copilot. Ask a colleague who reads the language to check each version before it goes out. Nothing is sent until you choose to send it.","more":["Shorten the English version to three lines for a Teams post."],"storyLine":"Communications tells every market, in their language.","id":"3.4"}]},{"id":"agents","kind":"try","nav":"Delegate the work, own the decision","navSub":"Researcher","title":"Delegate the work, own the decision","desc":"Built-in agents take on work that needs more than a single prompt. Learn when to reach for one, how to brief it well and how to check what comes back.","skill":"Working with built-in agents","features":"Researcher","notes":["Researcher can take several minutes. Start the request, keep working, and come back to it."],"appsEyebrow":"Same Copilot, different depth","appsTitle":"Which experience to reach for","appsIntro":"Choose by how much work the request needs, not by which app you happen to be in.","apps":[{"t":"Copilot Chat or an app","q":"One question, or the file in front of you","d":"A quick answer or a single piece of work.","icon":"chat"},{"t":"Researcher","q":"Your work content and the web, over several steps","d":"A structured, sourced report on a topic.","icon":"researcher"}],"story":{"label":"Live on 23 November · Chapter 4 of 4","title":"The analyst asks Researcher","setup":"Leadership will ask how the results compare with what is happening in the market. The analyst hands the research to Researcher.","output":"A sourced research briefing on beverage trends in the markets that matter.","takeaway":"Separate fact from opinion, and check the sources before the research goes into a deck.","session":"Live on 23 November"},"prompts":[{"app":"Researcher","appIcon":"researcher","title":"Ask Researcher about the market","text":"@Researcher Build a briefing on beverage trends in [Hong Kong, Taiwan and mainland China] over the last two years, such as sugar reduction, ready-to-drink tea and sports drinks, using our internal documents and the web. Separate fact from opinion, cite your sources and end with the five implications that matter most for [my team].","how":"In Copilot Chat, type @ and pick Researcher, so you can call it from any conversation, or choose Researcher from the list of agents. It may ask clarifying questions first; answering them gives a more focused report. When the report is ready, save it as a Word document to use in the review.","stage":"simple","more":["Turn this briefing into a one-page summary for leadership.","Convert this report to a Word document."],"storyLine":"What is changing in what people drink?","id":"4.1","status":"licensed"}]},{"id":"lead","kind":"optional","nav":"Lead your team","navSub":"Leading adoption","title":"Lead your team's adoption (optional)","desc":"Teams adopt what their leaders use. Share how you use Copilot, agree how the team checks its work, and turn your best prompts into a shared habit.","skill":"Leading adoption","features":"Copilot Chat, Copilot Pages and Teams","story":{"label":"A short story","title":"From one person to the whole team","setup":"You have seen what Copilot can do for you. Now make it normal for your team, with clear habits and a few prompts everyone reuses.","output":"A team prompt library and a 30-day habit plan.","takeaway":null},"prompts":[{"app":"Copilot Chat","appIcon":"chat","title":"Say how you use it","text":"Write a short note to my team about how I am using Copilot this month: one task it saved me time on, one thing I still check myself, and one prompt they could try this week.","how":"Leaders who share their own use make it safe for others to try. Edit the note so it sounds like you.","stage":"simple","id":"5.1"},{"app":"Copilot Chat","appIcon":"chat","title":"Agree how the team works with Copilot","text":"Draft a one-page team agreement for using Copilot: what we use it for, how we check its answers before we share them, what we never paste into a prompt, and how we share prompts that work.","how":"Review it with the team and adjust it to Swire Coca-Cola HK's policies.","stage":"build","id":"5.2"},{"app":"Copilot Chat","appIcon":"chat","title":"Build a team prompt library","text":"Look at the prompts I have used most in my recent Copilot chats and turn the five most useful ones into a short prompt library my team could reuse, with a one-line note on when to use each.","how":"Sharing what works is how adoption spreads beyond the first group. Select Edit in Pages and share the page in your team's Teams channel.","stage":"build","id":"5.3","status":"licensed"},{"app":"Copilot Chat","appIcon":"chat","title":"Plan a 30-day habit","text":"Plan a 30-day Copilot habit for my team of [team size and roles]: one short prompt a day tied to our real work, building from simple to advanced, with a weekly check-in question.","how":"Post one prompt a day in your team chat and ask people to reply with what worked.","stage":"build","id":"5.4"},{"app":"Copilot Chat","appIcon":"chat","title":"Run a show-and-tell","text":"Prepare a 10-minute show-and-tell for our next team meeting: three prompts that worked for us, what each one produced, and what we learned about checking the answers.","how":"Ask two colleagues to show their own example. Real work from peers persuades more than any demo.","stage":"output","id":"5.5"}]},{"id":"knowledge","kind":"optional","nav":"Team knowledge","navSub":"Copilot with SharePoint","title":"Team knowledge with SharePoint (optional)","desc":"Ask questions of the sites and libraries your teams already keep, check projects for gaps, and build an agent that answers from your own documents.","skill":"Working with team knowledge","features":"Copilot Chat with SharePoint files, Copilot in SharePoint, agents","appsEyebrow":"Same Copilot, different app","appsTitle":"Where to run each prompt","appsIntro":"Copilot Chat answers from the sites and files you reference with /. SharePoint is where you create an agent for a site.","apps":[{"t":"Copilot Chat","q":"Sites, libraries and project documents you can open","d":"Ask questions, find the latest version and check documents against each other.","icon":"chat"},{"t":"SharePoint","q":"One site's documents","d":"Create an agent that answers only from that site.","icon":"sharepoint"}],"story":{"label":"A short story","title":"The same question, every week","setup":"The answers your team needs are already written down, in a site nobody can search well. Make them easy to ask for.","output":"An agent that answers your team's questions from your own documents.","takeaway":null},"prompts":[{"app":"Copilot Chat","appIcon":"chat","title":"Ask a team site","text":"Using the documents on /[site or library], what is our current guidance on [topic]? Cite the source document for each point.","how":"Answers come only from files you can already open. Open the cited documents to confirm.","stage":"simple","id":"6.1","status":"licensed"},{"app":"Copilot Chat","appIcon":"chat","title":"Find the latest version","text":"Find the latest approved version of our [policy, process or template] and summarize what changed since the previous version.","how":"Useful when several copies of a file exist. Check the file Copilot points to before you rely on it.","stage":"build","id":"6.2","status":"licensed"},{"app":"Copilot Chat","appIcon":"chat","title":"Check a project for alignment","text":"Review the project documents on /[site or folder] and check whether scope, schedule, budget, governance and dependencies line up. List each conflict or gap with the source document and a suggested owner.","how":"Useful before a steering or milestone review. Copilot only reads documents you can already open.","stage":"build","id":"6.3","status":"licensed"},{"app":"SharePoint","appIcon":"sharepoint","title":"Create an agent for a site","text":"Answer questions about [topic] using only the documents in this site. If the answer is not in the documents, say so.","how":"In SharePoint, select the site or the files you want, then select Create an agent and paste this as its instructions. Availability depends on Swire Coca-Cola HK's settings.","stage":"build","optional":true,"id":"6.4","status":"licensed"},{"app":"Copilot Chat","appIcon":"chat","title":"Build an agent for your team","text":"Create an agent called \"[Team] Helper\" for [team]. It should help us [main job, such as prepare for reviews or answer policy questions]. Ground it in /[our key documents].\n\nResponses should:\n- Cite the document each answer comes from.\n- Say so when the answer is not in the documents.\n- Use short tables for comparisons and timelines.\n- Flag anything that needs a decision or an owner.\n\nSuggest four conversation starters for the team.","how":"In Copilot Chat, select Create agent (or New agent) and paste this into Describe your agent. Review what Copilot drafts, test it, and share it only with your team. Availability depends on Swire Coca-Cola HK's settings.","stage":"output","optional":true,"id":"6.5","status":"licensed"}]},{"id":"yours","kind":"optional","nav":"Make it yours","navSub":"Personalization","title":"Make it yours (optional)","desc":"Tell Copilot once how you want it to respond, so you do not need to repeat it in every chat. Then set up a weekly brief that arrives on its own.","skill":"Personalizing Copilot","features":"Custom instructions, memory and scheduled prompts","story":{"label":"A short story","title":"Set it up once","setup":"You have used Copilot all session. Teach it how you like to work, then let the most useful prompt run itself every week.","output":"A weekly brief that arrives every Monday morning.","takeaway":null},"prompts":[{"app":"Copilot Chat","appIcon":"chat","title":"Set your custom instructions","text":"I am [your role] at Swire Coca-Cola HK. Based on my recent emails, documents, meetings and chats, suggest five short custom instructions that would make your answers more useful to me. Write each one as a single line that I can paste into my Copilot custom instructions.","how":"Run the prompt and choose the suggestions that fit you, or copy any of the lines below. Paste them into the Custom instructions box, one per line, and save. Copilot then follows them in every new chat.","stage":"simple","find":"In Copilot Chat, select the three dots (Settings and more) at the top right, then Settings. Select Personalization, then edit your custom instructions. The app is updated often, so what you see may differ slightly.","link":{"url":"https://support.microsoft.com/en-us/microsoft-365-copilot/customize-how-microsoft-365-copilot-responds-to-you","label":"Learn more about custom instructions"},"moreLabel":"Or copy a suggestion","more":["Be concise. Start with the conclusion or recommendation, then the supporting facts.","You do not always have to agree with me. Push back when I may be missing something or when the evidence points the other way.","If you are uncertain or my request is unclear, ask me before you make assumptions.","Always separate verified facts from inferences, and say clearly when information is missing.","When I share a plan or report, tell me what changed, why it matters and what I need to decide.","Match my tone to the audience: collaborative and concise for colleagues; formal, courteous and clear about next steps for partners and customers."],"id":"7.1","status":"licensed"},{"app":"Copilot Chat","appIcon":"chat","title":"See the difference","text":"Draft a short message to my team about this week's top priority.","how":"Run it in a new chat so your saved instructions apply. Notice how the length and tone have changed, and adjust your instructions if needed.","stage":"build","id":"7.2","status":"licensed"},{"app":"Copilot Chat","appIcon":"chat","title":"Check what Copilot remembers","text":"What do you remember about me and how I like to work?","how":"To add a memory, say \"Remember that ...\". To change or delete memories, go to Settings, then Personalization.","stage":"build","more":["Remember that I prefer short answers with a table, and that you do not always have to agree with me."],"id":"7.3"},{"app":"Copilot Chat","appIcon":"chat","title":"Your weekly brief","text":"Give me a short weekly brief from my email, Teams chats and calendar for the last week and the week ahead.\n\nSeparate it into:\n1. 🎯 Needs my decision this week\n2. 📈 Issues building on my projects\n3. 📅 Meetings to prepare for\n4. ✅ What I can delegate or ignore\n\nShow each section as a short table with Item and Why it matters. Use 🔴 for urgent, 🟠 for needs attention and 🟢 for on track. Keep the whole brief to one screen.","how":"This is the kind of prompt worth running every week. Change the four sections to fit your role, such as customers, regions or projects.","stage":"output","action":{"title":"Schedule it","text":"Check the brief is useful. Then hover over your prompt, select Schedule this prompt, choose Weekly on Monday morning and save.","note":"You must run a prompt once before you can schedule it. If scheduling is unavailable, save the prompt and run it each Monday."},"id":"7.4","status":"licensed"},{"app":"Copilot Chat","appIcon":"chat","title":"See what is holding you back","text":"Tell me the things I need to know about my psychology that have been holding me back, that I have never asked about.","how":"Run this for yourself; nobody else sees it. Copilot answers from what it knows about how you work, such as your email, chats and meetings. Treat the answer as a prompt for reflection, not as an assessment.","stage":"build","optional":true,"id":"7.5","status":"licensed"}]},{"id":"roles","kind":"optional","nav":"Prompts for your role","navSub":"Role-based prompting","title":"Prompts for your role (optional)","desc":"Templates for the teams in the room, enriched with examples from Microsoft's Scenario Library. Pick yours, replace the words in [brackets] with a real initiative and reference your own document, deck or meeting with /.","skill":"Role-based prompting","features":"Giving Copilot a role, a source and a clear output","notes":["If you see a model picker in Copilot Chat, try a reasoning model for a deeper answer."],"story":{"label":"A short story","title":"The same story, from your seat","setup":"Every team sees the same quarter differently. Give Copilot your role, point it to your source and ask for the decision you own.","output":"A role-specific review you can take into your next meeting.","takeaway":null},"prompts":[{"app":"Copilot Chat","appIcon":"chat","title":"Leadership and strategy","text":"Act as my chief of staff. Using /[plan or report] and my email and meetings from the last month, tell me where we are ahead of plan, where we are behind, the three decisions I need to make this quarter and the questions I should ask my leadership team.","how":"Replace the brackets, then add your file with /. More examples for this role:","more":["Draft a short update to the board or senior leadership on [topic]: what changed, why it matters and what we are doing about it.","What are the three biggest risks to [goal] this year, and what early warning signs should I watch for?"],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/executives/","label":"Executive Offices scenarios"},"id":"8.1"},{"app":"Copilot Chat","appIcon":"chat","title":"Sales and account management","text":"Act as a sales director. Using /[account plan or report], review [initiative] from [account]'s point of view. Tell me what they gain or lose, the likely objections and the three points I should raise in my next account meeting.","how":"Replace the brackets, then add your file with /. More examples for this role:","more":["Create an agenda for my call with [account], with exploratory questions to uncover their needs, pain points and plans for next year.","Act as a buyer at [account] who is worried about [margin or sell-through]. Push back on our proposal, then give me feedback on how I handled it."],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/sales/accelerate-customer-research-and-sales-preparation/","label":"Scenario: Accelerate customer research and sales preparation"},"id":"8.2"},{"app":"Copilot Chat","appIcon":"chat","title":"Marketing and brand","text":"Act as a senior brand strategist. Using /[brief, plan or results], assess [campaign]. Tell me who it will reach and who it misses, how it fits the brand, what the results so far show and the three changes that would most improve it.","how":"Replace the brackets, then add your file with /. More examples for this role:","more":["Recommend customer segments for [campaign] and the message that would work best for each.","Compare this draft product copy with /[the product specification] and flag anything inaccurate or missing."],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/retail/track-marketing-campaign-performance/","label":"Scenario: Track marketing campaign performance"},"id":"8.3"},{"app":"Copilot Chat","appIcon":"chat","title":"Finance","text":"Act as a finance partner. Stress-test [initiative] using /[business case or model]. Show where assumptions look optimistic, the full cost including hidden costs, a worst, base and upside case, and the three measures I should track each month.","how":"Replace the brackets, then add your file with /. More examples for this role:","more":["How should I structure an analysis of [investment or decision]? List the steps, the data I need and the risks to check.","Summarize the latest annual report of [company] in plain language, including the key risks and performance measures."],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/finance/","label":"Finance scenarios"},"id":"8.4"},{"app":"Copilot Chat","appIcon":"chat","title":"People and HR","text":"Act as a people partner. Using /[plan or announcement], assess how [change] affects our teams. Tell me how employees and managers are likely to react, the top adoption risks, what managers need to do differently and short talking points for each group.","how":"Replace the brackets, then add your file with /. More examples for this role:","more":["Update /[policy] for [change], list every section that changes, then draft a short note for managers explaining what is different.","Create a 30-day onboarding plan for a new [role] using /[onboarding guide], with a checklist for the hiring manager."],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/human-resources/","label":"Human Resources scenarios"},"id":"8.5"},{"app":"Copilot Chat","appIcon":"chat","title":"Technology","text":"Act as an IT advisor. Evaluate [initiative] using /[proposal]. Cover fit with our current systems, integration and data risks, security and compliance, what it means for people's day-to-day work and the decisions needed before we commit.","how":"Replace the brackets, then add your file with /. More examples for this role:","more":["Write a short, plain-language announcement for [system change]: what changes, when, and where to get help.","Create training content to get people up to speed on [new application]: a one-page guide and five FAQs."],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/information-technology/","label":"Information Technology scenarios"},"id":"8.6"},{"app":"Copilot Chat","appIcon":"chat","title":"Operations and supply chain","text":"Act as a supply chain advisor. Using /[plan or report], tell me how [initiative] will work across suppliers, freight and distribution centers. List the dependencies, where it could break during peak season, the decisions needed in the next 90 days and what must not slip.","how":"Replace the brackets, then add your file with /. More examples for this role:","more":["Summarize my supplier emails from the last week and flag anything that affects delivery dates, with the order it relates to.","Analyze the factors that could disrupt our supply chain in [region] over the next month, including weather, news and economic changes. Summarize them in a table with actions to reduce each risk."],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/retail/optimize-supply-chain-management/","label":"Scenario: Optimize supply chain management"},"id":"8.7"},{"app":"Copilot Chat","appIcon":"chat","title":"Customer service","text":"Act as a customer service lead. Using /[case export or survey results], find the top five reasons customers contact us, what each one costs us, and the fix that would remove the most contacts.","how":"Replace the brackets, then add your file with /. More examples for this role:","more":["Draft a clear, empathetic reply to this customer complaint that explains what happened and what we will do next.","Turn these resolved cases into five short help articles customers could use on their own."],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/customer-service/","label":"Customer Service scenarios"},"id":"8.8"},{"app":"Copilot Chat","appIcon":"chat","title":"Legal and compliance","text":"Act as a contracts reviewer. Compare /[contract] with /[our standard terms] and list every clause that differs, the risk it creates and the change you would ask for. Mark anything that needs a lawyer's review.","how":"Replace the brackets, then add your file with /. More examples for this role:","more":["Summarize the obligations, dates and renewal terms in /[contract] in a table.","Explain [regulation or policy] in plain language for [team], with what they need to do differently."],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/legal/","label":"Legal scenarios"},"id":"8.9"},{"app":"Copilot Chat","appIcon":"chat","title":"Merchandising and category management","text":"Act as a merchandising advisor. Using /[assortment plan or sales report], review [category]. Tell me which products are over- or under-performing, where the range overlaps, and the three changes I should consider for the next buy or reset. Separate what the data shows from assumptions.","how":"Replace the brackets, then add your file with /. More examples for this role:","more":["Create a table rating potential suppliers for [category] on price, quality, delivery time and certifications.","Considering last year's sales and this year to date, what is the right balance of core and seasonal products for [category]?"],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/retail/improve-merchandising-decisions/","label":"Scenario: Improve merchandising decisions"},"id":"8.10"},{"app":"Copilot Chat","appIcon":"chat","title":"Product development and innovation","text":"Act as a product reviewer. Using /[brief or concept], assess [product]. Tell me who it is for, how it differs from what we already offer, the open decisions before the next milestone and five questions to expect in the review.","how":"Replace the brackets, then add your file with /. More examples for this role:","more":["Summarize what customer reviews and returns say about [product], and what we should change in the next version.","Identify trends in consumer preferences for [category] and turn them into five new product ideas, with the target customer for each."],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/retail/streamline-market-research-and-strategy/","label":"Scenario: Streamline market research and strategy"},"id":"8.11"},{"app":"Copilot Chat","appIcon":"chat","title":"Stores and field operations","text":"Assess this photo of [our display, shelf or fixture] for product placement, brand consistency, stock levels and how easily shoppers can find what they need. List what to fix first.","how":"Select + and add a photo of a display, shelf or fixture. Works from the Copilot mobile app during a store visit. More examples for this role:","more":["Compare [store]'s performance with our top stores and suggest what to look at first.","Summarize the feedback from our top-performing store managers in /[file] and turn it into five best practices.","Draft an email to the managers of [stores below target] sharing these best practices and the next steps."],"link":{"url":"https://adoption.microsoft.com/en-us/scenario-library/retail/maximize-store-performance/","label":"Scenario: Maximize store performance"},"id":"8.12"}],"links":{"eyebrow":"Find more examples","title":"Microsoft Scenario Library","intro":"Step-by-step scenarios with sample prompts for every business function and industry. Use them to find more ideas for your own role.","items":[{"label":"Scenario Library home","url":"https://adoption.microsoft.com/en-us/scenario-library/","d":"Browse by industry or function"},{"label":"Retail scenarios","url":"https://adoption.microsoft.com/en-us/scenario-library/retail/","d":"Merchandising, supply chain, marketing and stores","tags":["retail","consumer-goods"]},{"label":"Manufacturing","url":"https://adoption.microsoft.com/en-us/scenario-library/manufacturing/","d":"Operations, quality and supply","tags":["consumer-goods","manufacturing"]},{"label":"Executive Offices","url":"https://adoption.microsoft.com/en-us/scenario-library/executives/","d":"Strategy, briefings and communication"},{"label":"Finance","url":"https://adoption.microsoft.com/en-us/scenario-library/finance/","d":"Planning, analysis, procure to pay"},{"label":"Marketing","url":"https://adoption.microsoft.com/en-us/scenario-library/marketing/","d":"Research, campaigns and content"},{"label":"Sales","url":"https://adoption.microsoft.com/en-us/scenario-library/sales/","d":"Customer research, pitches and follow-up"},{"label":"Human Resources","url":"https://adoption.microsoft.com/en-us/scenario-library/human-resources/","d":"Policies, onboarding and recruiting"},{"label":"Operations","url":"https://adoption.microsoft.com/en-us/scenario-library/operations/","d":"Business reviews, projects and change plans"},{"label":"Information Technology","url":"https://adoption.microsoft.com/en-us/scenario-library/information-technology/","d":"Support, rollout and training"},{"label":"Customer Service","url":"https://adoption.microsoft.com/en-us/scenario-library/customer-service/","d":"Cases, knowledge and service quality"},{"label":"Legal","url":"https://adoption.microsoft.com/en-us/scenario-library/legal/","d":"Contracts, policy and compliance"}]}},{"id":"mobile","kind":"optional","nav":"On the go","navSub":"Mobile and voice","title":"On the go: mobile and voice (optional)","desc":"Copilot works between meetings, on the floor and in the car. Use your voice, your camera and the files on your phone.","skill":"Mobile and voice","features":"Microsoft 365 Copilot mobile app, voice, camera and photos","notes":["Install the Microsoft 365 Copilot app on your phone and sign in with your work account."],"story":{"label":"A short story","title":"Between two meetings","setup":"You have ten minutes and a phone. Get ready for the next meeting, capture what happened in the last one and reply before you lose the thread.","output":"A reply sent from your phone and a list of actions captured from a whiteboard.","takeaway":null},"prompts":[{"app":"Copilot mobile app","appIcon":"chat","title":"Catch up by voice","text":"Catch me up on my next meeting: who is attending, what we decided last time and what I should ask.","how":"Select the microphone and speak the prompt. Useful on the way to a meeting.","stage":"simple","id":"9.1","status":"licensed"},{"app":"Copilot mobile app","appIcon":"chat","title":"From whiteboard to actions","text":"Turn this whiteboard photo into a list of decisions, owners and next steps.","how":"Select + and take a photo of the whiteboard or flip chart before you send the prompt.","stage":"build","id":"9.2"},{"app":"Copilot mobile app","appIcon":"chat","title":"Check a display or shelf","text":"Assess this photo of [our display or shelf] for product placement, stock levels and anything that looks out of place. List what to fix first.","how":"Select + and take a photo during a store or site visit.","stage":"build","optional":true,"id":"9.3"},{"app":"Copilot mobile app","appIcon":"chat","title":"Translate on the spot","text":"Translate this [label, sign or message] into [language] and tell me if anything is ambiguous.","how":"Take a photo or paste the text. Check important translations with a native speaker before you rely on them.","stage":"build","id":"9.4"},{"app":"Copilot mobile app","appIcon":"outlook","title":"Reply before you lose the thread","text":"Draft a short reply to [person]'s latest email confirming [decision] and the next step. Keep it under 80 words.","how":"Review the draft on your phone and send it yourself.","stage":"output","id":"9.5","status":"licensed"}]},{"id":"sharpen","kind":"optional","nav":"Sharpen your prompts","navSub":"Prompt Coach","title":"Sharpen your prompts (optional)","desc":"Habits that improve every answer: refine your prompt with Prompt Coach, ask Copilot what it needs, challenge the answer, and carry a long conversation into a fresh chat.","skill":"Refining prompts and challenging answers","features":"Prompt Coach; checking assumptions and evidence","notes":["Too vague: \"Help me with my emails\" becomes \"Summarize the emails from suppliers about payment terms I received this week.\"","Missing context: \"Draft a response\" becomes \"Draft a professional response declining this budget request while keeping a good relationship with the requester.\"","Not specific: \"Find the finance emails\" becomes \"Find the emails from the finance team about [topic] this quarter.\""],"appsEyebrow":"Before you start","appsTitle":"Where to run each step","appsIntro":"Run the first prompt in Prompt Coach. The others work in Copilot Chat or any Copilot.","apps":[{"t":"Prompt Coach","q":"Improve a prompt","d":"In Copilot Chat, select Agents, then All agents. Search for Prompt Coach, add it and open it.","icon":"coach"},{"t":"Copilot Chat","q":"Challenge the answer","d":"Run it straight after any answer you plan to rely on.","icon":"chat"}],"story":{"label":"A short story","title":"The prompt that missed","setup":"Your first prompt gave a vague answer. Instead of giving up, improve the prompt, then test the answer before you rely on it.","output":"A better prompt you can reuse, and an answer you have checked.","takeaway":null},"cardsTitle":"Six habits of experienced Copilot users","cards":[{"t":"Ask for the end product","d":"Don't stop at the recap. Ask for the follow-up email, the slide or the checklist you actually need."},{"t":"Point to your sources","d":"Type / to reference the file, meeting or person. Grounding Copilot in your own work is the biggest single upgrade."},{"t":"Break big requests down","d":"Ask for an outline first, then expand one section at a time, instead of cramming everything into one prompt."},{"t":"Give Copilot a role","d":"\"Act as a finance partner\" or \"critique this as my manager would\" changes the depth and angle of the answer."},{"t":"Change one thing and retry","d":"If an answer misses, don't repeat the same prompt. Add the source, the audience or the format and ask again."},{"t":"Ask for options","d":"\"Give me three versions\" or \"what else should I consider?\" surfaces ideas a single answer can hide."}],"prompts":[{"app":"Prompt Coach","appIcon":"coach","title":"Improve my prompt","text":"Help me improve this prompt: \"[Give me an update on our project]\". Ask me up to three questions that would lead to a better answer. Then rewrite the prompt with a clear goal, context, source and expectations.","how":"Replace the example in [ ] with a prompt of your own. Answer the questions, then run the rewritten prompt in Copilot Chat and compare it with the result of the original.","stage":"simple","id":"10.1"},{"app":"Copilot Chat","appIcon":"chat","title":"Ask Copilot what it needs","text":"Before you answer, what specific details or context do you need from me to [create a plan for improving our results in a region]? Ask me your questions one at a time.","how":"Useful when you are not sure what to include. Answer the questions, and Copilot builds the full request with you.","stage":"build","id":"10.2"},{"app":"Copilot Chat (or any Copilot)","appIcon":"chat","title":"Challenge the answer","text":"What assumptions did you make in that answer? Which part has the weakest support, and what information would change your conclusion?","how":"Do not accept an answer as given: challenge it. This works on any answer, in any Copilot, before you rely on it for an important decision.","stage":"build","id":"10.3"},{"app":"Copilot Chat","appIcon":"chat","title":"Carry a long conversation forward","text":"What is the resultant prompt so far? Write it as one prompt I can paste into a new chat to get the same result.","how":"Long conversations can drift or reach their limit. Paste the consolidated prompt into a new chat and continue from there.","stage":"output","id":"10.4"}]},{"id":"learn","kind":"optional","nav":"Keep learning","navSub":"On-demand resources","title":"Keep learning (optional)","desc":"The session ends; the habit starts. Plan your next steps, retire the habits that hold your answers back, and use short on-demand resources when you are stuck or missed a session.","skill":"Building the habit","features":"A personal learning plan, better prompting habits and Microsoft's on-demand resources","story":{"label":"A short story","title":"After today","setup":"You have tried Copilot on real work. Keep the momentum with a small plan, one habit at a time, and help that is there when you need it.","output":"A four-week learning plan and a one-page cheat sheet built around your own work.","takeaway":null},"prompts":[{"app":"Copilot Chat","appIcon":"chat","title":"Build my learning plan","text":"Create a four-week plan for me to get better at Copilot in [the apps I use most]. Give me 20 minutes a week: one short practice task tied to my real work, one habit to build and one thing to check in Copilot's answers. End with how I will know I have improved.","how":"Run it at the end of the session, then put the four practice slots in your calendar.","stage":"simple","id":"11.1"},{"app":"Copilot Chat","appIcon":"chat","title":"Retire a bad habit","text":"Here is how I usually ask Copilot for help: \"[paste a prompt you use often]\". Which habits in this prompt lead to weaker answers, and how should I change them? Rewrite it, then give me three rules to remember.","how":"Most answers get better from a few small changes: a clear goal, a source, an audience and a format.","stage":"build","id":"11.2"},{"app":"Copilot Chat","appIcon":"chat","title":"Turn today into a cheat sheet","text":"Turn these prompts into a one-page cheat sheet for my role: [paste the three prompts that worked best for you today]. For each, add when to use it and the follow-up question I should always ask.","how":"Select Edit in Pages to keep the cheat sheet, and share it with your team if it helps them too.","stage":"output","id":"11.3"}],"links":{"eyebrow":"On-demand resources","title":"Help when you need it","intro":"Short articles and training from Microsoft, for anyone who missed a session or wants to go further.","items":[{"label":"Get started writing prompts in Microsoft Copilot","url":"https://support.microsoft.com/en-us/topic/learn-about-copilot-prompts-f6c3b467-f07c-4db1-ae54-ffac96184dd5","d":"The basics of a good prompt"},{"label":"Get started with Microsoft Copilot Chat","url":"https://support.microsoft.com/en-us/microsoft-365-copilot/get-started-with-microsoft-365-copilot-chat","d":"Chat with your work and the web"},{"label":"Chat with Copilot in Outlook","url":"https://support.microsoft.com/en-us/outlook/copilot-outlook/chat-with-copilot-in-outlook","d":"Email and calendar"},{"label":"Catch up on meetings with Microsoft Copilot in Teams","url":"https://support.microsoft.com/en-us/teams/copilot/catch-up-on-meetings-with-microsoft-365-copilot-in-teams","d":"During and after meetings"},{"label":"Welcome to Copilot in Word","url":"https://support.microsoft.com/en-us/word/welcome-to-copilot-in-word","d":"Draft, rewrite and question documents"},{"label":"Get started with Copilot in Excel","url":"https://support.microsoft.com/en-us/excel/copilot/get-started-with-copilot-in-excel","d":"Analyze, chart and add formulas"},{"label":"Create a new presentation with Copilot in PowerPoint","url":"https://support.microsoft.com/en-us/powerpoint/copilot/create-a-new-presentation-with-copilot-in-powerpoint","d":"From a prompt or a document"},{"label":"Use branded templates in the Microsoft Copilot app","url":"https://support.microsoft.com/en-us/Microsoft-365-Copilot/use-branded-templates-in-the-microsoft-365-copilot-app","d":"Keep documents and slides on brand"},{"label":"Draft, analyze, and present with Microsoft Copilot","url":"https://learn.microsoft.com/en-us/training/paths/get-started-with-microsoft-365-copilot/","d":"Self-paced training on Microsoft Learn"},{"label":"Get help with Copilot","url":"https://support.microsoft.com/en-us/copilot","d":"All Copilot help articles"},{"label":"Microsoft Copilot adoption","url":"https://adoption.microsoft.com/en-us/copilot/","d":"Guides and resources for rolling out Copilot"},{"label":"Microsoft Scenario Library","url":"https://adoption.microsoft.com/en-us/scenario-library/","d":"Use cases by function and industry"}]}}],"icons":{"chat":"data:image/png;base64,iVBOR     if(e.levels){var pl=el('div','panel');pl.appendChild(el('div','caps',t(e.levels.eyebrow)));pl.appendChild(el('h3',null,t(e.levels.title)));pl.appendChild(el('p',null,t(e.levels.intro)));var lg=el('div','grid3 lvl');e.levels.items.forEach(function(c,k){var cd=el('div','card');cd.appendChild(el('div','n',String(k+1)));cd.appendChild(el('h4',null,t(c.t)));cd.appendChild(el('p',null,t(c.d)));lg.appendChild(cd)});pl.appendChild(lg);s.appendChild(pl)}
    if(e.before){var pb0=el('div','panel');pb0.appendChild(el('div','caps',t(e.before.eyebrow)));pb0.appendChild(el('h3',null,t(e.before.title)));pb0.appendChild(el('p',null,t(e.before.intro)));var bg=el('div','bws');e.before.cols.forEach(function(c){var x=el('div','bw');if(c.img){var bh=el('div','bwh'+(c.imgLogo?' logo':''));var bim=el('img');bim.src=c.img;bim.alt=t(c.imgAlt);bh.appendChild(bim);x.appendChild(bh)}x.appendChild(el('h4',null,t(c.t)));var ol=el('ol');c.steps.forEach(function(q){ol.appendChild(el('li',null,t(q)))});x.appendChild(ol);if(c.note)x.appendChild(el('p','bwn',t(c.note)));if(c.link){x.appendChild(link('open',t(c.link.label),c.link.url))}bg.appendChild(x)});pb0.appendChild(bg);if(e.before.tip){var bt=el('div','bwt');bt.appendChild(el('b',null,t(e.before.tip.t)));bt.appendChild(document.createTextNode(t(e.before.tip.d)));pb0.appendChild(bt)}s.appendChild(pb0)}
    if(e.site){var ps0=el('div','panel site');ps0.appendChild(el('h3',null,t(e.site.title)));var so=el('ol');e.site.steps.forEach(function(q){so.appendChild(el('li',null,t(q)))});ps0.appendChild(so);s.appendChild(ps0)}
    if(e.prompts&&e.prompts.length){
      var sh=el('div','sechead');sh.appendChild(el('h3',null,t(UI.prompts)));sh.appendChild(el('span',null,t(UI.count).replace('{n}',e.prompts.length)));s.appendChild(sh);
      e.prompts.forEach(function(p){if(p.groupTitle){var gh=el('div','sechead');gh.appendChild(el('h3',null,t(p.groupTitle)));s.appendChild(gh)}s.appendChild(p.slot?slotCard(p,e):promptCard(p))});
    }
    if(e.story&&e.story.takeaway){var tk=el('div','takeaway');tk.appendChild(el('b',null,t(UI.takeaway)));tk.appendChild(el('p',null,t(e.story.takeaway)));s.appendChild(tk)}
    if(e.links){var pk=el('div','panel');pk.appendChild(el('div','caps',t(e.links.eyebrow)));pk.appendChild(el('h3',null,t(e.links.title)));pk.appendChild(el('p',null,t(e.links.intro)));var lkg=el('div','lnks');e.links.items.forEach(function(c){var a=link('lnkc','',c.url);a.textContent='';a.appendChild(el('b',null,t(c.label)));a.appendChild(el('span',null,t(c.d)));lkg.appendChild(a)});pk.appendChild(lkg);s.appendChild(pk)}
    var pg=el('div','pager');
    var pv=el('button','pg','← '+t(UI.prev));pv.type='button';if(i===0)pv.disabled=true;pv.addEventListener('click',function(){go(i-1)});
    var nx=el('button','pg nextb',(i===0?t(UI.begin):t(UI.next))+' →');nx.type='button';if(i===N)nx.disabled=true;nx.addEventListener('click',function(){go(i+1)});
    pg.appendChild(pv);pg.appendChild(nx);s.appendChild(pg);
    return s;
  }
  function render(){
    document.documentElement.lang=lang;document.documentElement.setAttribute('data-theme',theme);
    document.title=t(EX[cur].nav)+' | '+t(M.guide);
    $('eyebrow').textContent=t(M.eyebrow);$('choose').textContent=t(UI.choose);
    $('countAll').textContent=t(UI.countAll).replace('{n}',N);
    $('guide').textContent=t(M.guide);$('guideSub').textContent=t(M.guideSub);
    $('btnTheme').textContent=t(UI.theme);$('printBtn').textContent=t(UI.print);
    var bl=$('btnLang');if(LANGS.length>1){var other=LANGS[(LANGS.indexOf(lang)+1)%LANGS.length];bl.textContent=(M.langNames&&M.langNames[other])||other;bl.hidden=false}else{bl.hidden=true}
    $('progText').textContent=cur===0?t(UI.kinds.start):t(UI.of).replace('{i}',cur).replace('{n}',N);
    $('fill').style.inlineSize=(cur/N*100)+'%';
    var tr=$('track');tr.setAttribute('aria-valuemax',N);tr.setAttribute('aria-valuenow',cur);
    $('fFict').textContent=t(UI.fictional);$('fNote').textContent=t(UI.footer);
    $('fVer').textContent=t(UI.version)+' '+M.version+' · '+t(M.date);
    renderNav();
    var st=$('stage');st.textContent='';PT={};EX.forEach(function(e,i){st.appendChild(section(e,i))});ptRefresh();
  }
  $('btnTheme').addEventListener('click',function(){theme=theme==='dark'?'light':'dark';set('theme',theme);render()});
  $('btnLang').addEventListener('click',function(){lang=LANGS[(LANGS.indexOf(lang)+1)%LANGS.length];set('lang',lang);render()});
  $('printBtn').addEventListener('click',doPrint);
  document.addEventListener('keydown',function(ev){if(ev.altKey&&ev.key==='ArrowRight')go(cur+1);if(ev.altKey&&ev.key==='ArrowLeft')go(cur-1)});
  render();
})();
